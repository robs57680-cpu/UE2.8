<main id="v"></main>
<nav><button data-t="fiches">📚<br>Glossaire</button><button data-t="qcm">✅<br>QCM</button><button data-t="exam">✍️<br>Examen</button></nav>
<script>
const SH="Surveiller la douleur, la fièvre, les signes d'infection;Hydratation et alimentation adaptée (régime pauvre en graisses);Surveiller la diurèse et les urines;Préparer et accompagner aux examens / intervention;Éduquer à l'hygiène de vie et suivi";
const D=[
{i:"🦵",n:"Ischémie artérielle aiguë",d:"Manque brutal d'apport sanguin dans un territoire artériel",f:"Thrombose artérielle (athérosclérose);Embolie (cardiaque, aortique);Dissection artérielle;Traumatisme, chirurgie;HTA, diabète, tabac, hypercholestérolémie, âge",s:"Douleur brutale, intense, d'apparition soudaine;Pâleur, froid, marbrures;Absence ou diminution des pouls;Troubles de la sensibilité et de la motricité;Parfois paralysie",e:"Examen clinique (pouls, couleur, température, sensibilité);Écho-Doppler artériel (1er choix);Angio-scanner / artériographie;Bilan biologique (lactates, CPK)",t:"Urgence thérapeutique;Anticoagulation (héparine);Revascularisation (chirurgie ou thrombolyse);Antalgie, oxygénothérapie;Traitement de la cause",r:"Surveillance de la douleur;Surveiller pouls, couleur, température, motricité, sensibilité;Prévenir les complications (nécrose, syndrome des loges);Préparer et surveiller les traitements;Éducation : arrêt du tabac, contrôle des FDR",k:"Une ischémie artérielle aiguë est une urgence vitale !"},
{i:"🩸",n:"Phlébite",d:"Inflammation d'une veine, le plus souvent profonde (membre inférieur)",f:"Immobilisation (alitement, voyage);Chirurgie, traumatisme;Cancer, traitements hormonaux;Antécédents de MTEV;Âge, obésité, tabac, grossesse, thrombophilie",s:"Douleur sur le trajet veineux;Rougeur, chaleur, œdème;Sensibilité à la palpation;Parfois fièvre (phlébite superficielle);Souvent asymptomatique (sauf phlébite profonde)",e:"Examen clinique;Écho-Doppler veineux (examen de choix);D-Dimères (si suspicion);Bilan sanguin (inflammation)",t:"Anticoagulation (HBPM, AVK, AOD);Anti-inflammatoires / antalgiques;Bas de contention;Mobilisation précoce;Traitement de la cause",r:"Surveillance des signes (douleur, œdème, température);Surveillance des traitements anticoagulants (risque hémorragique);Prévention de la MTEV;Conseils : hydratation, mobilisation, port des bas, arrêt du tabac",k:"Devant une suspicion de phlébite, toujours penser au risque d'embolie pulmonaire !"},
{i:"🫁",n:"Embolie pulmonaire",d:"Obstruction d'une artère pulmonaire par un caillot (souvent issu d'une TVP)",f:"Thrombose veineuse profonde (TVP);Immobilisation, chirurgie, traumatisme;Cancer;Grossesse, contraception œstroprogestative;Thrombophilie;Âge, obésité, tabac",s:"Dyspnée brutale;Douleur thoracique (plurale);Tachycardie;Tachypnée;Hémoptysie (parfois);Malaise, lipothymie;Parfois asymptomatique",e:"Score de Genève / Wells;D-Dimères (si faible probabilité);Angio-scanner thoracique (1er choix);Scintigraphie pulmonaire (si CI scanner);Écho-Doppler des MI (recherche TVP);Bilan sanguin (gaz du sang, troponine)",t:"Anticoagulation (HBPM, AVK, AOD);Oxygénothérapie (si hypoxémie);Thrombolyse (forme grave);Antalgiques, surveillance;Traitement de la cause;Hospitalisation selon la gravité",r:"Surveillance respiratoire (FR, SpO2, douleur);Surveiller les signes de gravité;Surveillance des traitements anticoagulants (risque hémorragique);Mobilisation précoce;Prévention des récidives;Éducation : hydratation, arrêt du tabac, port des bas",k:"L'embolie pulmonaire est une urgence diagnostique et thérapeutique !"},
{i:"❤️",n:"Infarctus du myocarde",d:"Nécrose d'une partie du muscle cardiaque par occlusion d'une artère coronaire",f:"Athérosclérose (thrombose);Tabac, HTA, diabète, hypercholestérolémie, âge, sédentarité, stress, antécédents familiaux;Spasme coronaire (plus rare)",s:"Douleur thoracique intense, en étau, > 20 min;Irradiation (bras gauche, mâchoire, dos, épaule);Sueurs, nausées, vomissements;Dyspnée, anxiété;Parfois atypique (personnes âgées, diabétiques)",e:"ECG (élévations ST, ondes Q);Dosage des troponines (↑);Bilan sanguin (NFS, iono, glycémie);Coronarographie (si besoin);Échocardiographie (fonction cardiaque)",t:"Antalgie (morphine si besoin);Dérivés nitrés (si pas de contre-indication);Antiagrégants plaquettaires (Aspirine + clopidogrel);Anticoagulation (HBPM/HNF);Revascularisation (angioplastie ou thrombolyse);Traitement de fond (bêtabloquants, statines)",r:"Surveillance de la douleur;Surveillance ECG, TA, FC, SpO2;Administration et surveillance des traitements;Prévention des complications (troubles du rythme, IC);Éducation : arrêt du tabac, alimentation, activité physique, suivi médical",k:"Chaque minute compte : plus la reperfusion est rapide, plus le muscle cardiaque est sauvé !"},
{i:"🧠",n:"AVC (Accident Vasculaire Cérébral)",d:"Interruption brutale de la circulation sanguine cérébrale. Ischémique (≈ 80 %) : caillot. Hémorragique (≈ 20 %) : rupture d'un vaisseau. Privation d'oxygène → lésions neuronales",f:"HTA, diabète, dyslipidémie;Tabac, alcool, sédentarité;Âge > 65 ans;Antécédents (AVC, AIT, cardiopathie);Fibrillation auriculaire;Troubles de la coagulation",s:"F.A.S.T. : Face (asymétrie du visage);F.A.S.T. : Bras (faiblesse d'un membre);F.A.S.T. : Élocution (trouble de la parole);F.A.S.T. : Temps → urgence;Céphalée brutale, troubles de la vision, vertiges, troubles de l'équilibre, confusion",e:"Scanner cérébral (en urgence);IRM cérébrale;Bilan sanguin (NFS, iono, glycémie);ECG (recherche FA);Écho-Doppler des troncs supra-aortiques;Angio-scanner / angio-IRM",t:"Ischémique : thrombolyse (si < 4h, selon critères);Ischémique : antiagrégant plaquettaire (Aspirine);Ischémique : anticoagulant (selon cause);Hémorragique : arrêt des anticoagulants;Hémorragique : traitement chirurgical si besoin;Rééducation précoce",r:"Surveiller constantes, conscience, score NIHSS;Installer en position adaptée (tête 30°, éviter les fausses routes);Prévenir les complications (escarres, TVP, infection, chute);Aider à la rééducation et à l'autonomie;Éduquer le patient et la famille (facteurs de risque, signes d'alerte)",g:"Installation brutale des symptômes;Troubles de la conscience;Déficit moteur important;Troubles de la parole, vision, équilibre → APPEL IMMÉDIAT AU 15",k:"L'AVC est une urgence neurologique : plus vite pris en charge, moins de séquelles !"},
{i:"💢",n:"Angor (angine de poitrine)",d:"Douleur thoracique due à une insuffisance transitoire d'oxygène du muscle cardiaque (ischémie myocardique), souvent liée à une sténose des artères coronaires (athérosclérose)",f:"Athérosclérose (HTA, diabète, dyslipidémie);Tabac, âge > 50 ans;Sédentarité, surpoids;Stress, effort intense, froid;Antécédents familiaux",s:"Douleur thoracique en pression, serrement;Irradiation : bras gauche, mâchoire, dos;Déclenchée par l'effort, le stress, le froid;Cède au repos ou aux dérivés nitrés;Douleur typique de quelques minutes (5 à 15 min);Parfois essoufflement, sueurs, nausées",e:"ECG (au repos et effort);Épreuve d'effort;Écho de stress;Bilan sanguin (cholestérol, glycémie);Coronarographie (si besoin)",t:"Dérivés nitrés (crise);Traitement de fond : antiagrégants (Aspirine);Traitement de fond : bêtabloquants;Traitement de fond : statines;Traitement de fond : inhibiteurs calciques;Hygiène de vie (effort, alimentation)",r:"Évaluer la douleur (caractéristiques, durée, intensité);Administrer les traitements (nitrés, O2 si besoin);Surveiller constantes, ECG;Prévenir les récidives (éducation thérapeutique);Soutenir et rassurer le patient",g:"Douleur > 20 min malgré le repos et les nitrés;Douleur intense, inhabituelle;Signes associés : dyspnée, sueurs, malaise → APPEL IMMÉDIAT AU 15",k:"L'angor est un signal d'alerte : il peut évoluer vers un infarctus !"},
{i:"🌬️",n:"BPCO",d:"Maladie respiratoire chronique, non réversible (ou peu), liée à une obstruction des bronches et à une destruction du tissu pulmonaire (emphysème). Réduction du débit expiratoire",f:"Tabac (principal);Exposition professionnelle / pollution;Polluants atmosphériques;Antécédents familiaux;Âge > 40 ans",s:"Dyspnée d'effort puis au repos;Toux chronique (matinale);Expectorations (sputum);Sifflements (épisodes);Infections respiratoires fréquentes;Fatigue, amaigrissement (stade avancé)",e:"EFR (spirométrie) : VEMS/CV ↓;Gaz du sang (si aggravation);Radio thorax / TDM;Bilan biologique (selon contexte)",t:"Arrêt du tabac (essentiel);Bronchodilatateurs;Corticoïdes (si exacerbation);Kinésithérapie respiratoire;Oxygénothérapie (si besoin);Vaccinations (grippe, pneumocoque)",r:"Surveiller la saturation, la dyspnée, la fréquence respiratoire;Aider à la prise des traitements (inhalateurs);Prévenir les exacerbations (signes d'alerte, vaccinations);Éduquer à l'arrêt du tabac et aux gestes respiratoires;Soutenir l'activité physique adaptée",g:"Augmentation de la dyspnée;Cyanose, confusion;Aggravation de la toux / des expectorations;SpO2 < 90 % → APPEL AU 15",k:"La BPCO est une maladie chronique : un suivi régulier améliore la qualité de vie !"},
{i:"😴",n:"Apnées du sommeil",d:"Arrêts répétés de la respiration pendant le sommeil (≥ 10 secondes). Due à un collapsus des voies aériennes supérieures (obstructive) ou à un défaut de commande cérébrale (centrale). → Hypoxie, micro-réveils, fragmentation du sommeil",f:"Surpoids, obésité;Cou large, mâchoire rétrusive;Âge > 40 ans;Tabac, alcool, sédatifs;Antécédents familiaux;Maladies associées (HTA, diabète)",s:"Ronflements importants;Pauses respiratoires observées;Somnolence diurne (même au volant);Céphalées matinales;Fatigue, troubles de la concentration;Irritabilité, baisse de moral",e:"Polygraphie ventilatoire (à domicile ou en hôpital);Polysomnographie (enregistrement complet);Évaluation du retentissement (échelle de somnolence, bilan cardio)",t:"Mesures hygiéno-diététiques (perte de poids, position, alcool);PPC : pression positive continue (masque);Orthèse d'avancée mandibulaire (selon cas);Traitement des comorbidités",r:"Expliquer et rassurer (traitement et observance);Surveiller la tolérance à la PPC;Évaluer la somnolence et la qualité du sommeil;Conseiller sur l'hygiène de vie (poids, alcool, tabac);Suivre les comorbidités (HTA, diabète, cardio)",g:"Somnolence diurne importante;Troubles cognitifs, humeur;HTA non contrôlée;Risque cardiovasculaire élevé → AVIS MÉDICAL RAPIDE",k:"Les apnées du sommeil ne sont pas qu'un problème de nuit : elles impactent tout l'organisme !"},
{i:"💧",n:"OAP (Œdème Aigu du Poumon)",d:"Accumulation de liquide dans les alvéoles pulmonaires → échanges gazeux perturbés. Souvent lié à une insuffisance cardiaque gauche. Augmentation de la pression hydrostatique capillaire pulmonaire",f:"Insuffisance cardiaque (IC);HTA, coronaropathie, valvulopathie;Surcharge hydrosodée;Troubles du rythme;Non observance du traitement;Âge, tabac, diabète, obésité",s:"Dyspnée brutale (au repos, puis orthopnée);Polypnée, tachycardie;Saturation en O2 ↓;Crépitants pulmonaires (râles);Mousse rosée (parfois);Anxiété, agitation",e:"Radio thorax (syndrome alvéolaire);Gaz du sang (hypoxémie);ECG (ischémie, trouble du rythme);BNP / NT-proBNP (si doute);Échographie cardiaque (si besoin)",t:"Position demi-assise;Oxygénothérapie (si SpO2 < 92 %);Diurétiques (furosémide);Vasodilatateurs (si HTA);Traitement de la cause;Surveillance scopée",r:"Installer le patient en position demi-assise;Surveiller SpO2, FC, TA, FR, diurèse;Évaluer la dyspnée et l'efficacité du traitement;Prévenir l'anxiété (rassurer, expliquer);Surveiller l'état respiratoire et les râles;Éduquer sur l'hygiène de vie (sel, poids, traitement)",g:"Détresse respiratoire, cyanose;SpO2 < 90 %;Troubles de la conscience;Hypotension (choc cardiogénique) → APPEL IMMÉDIAT AU 15",k:"L'OAP est une urgence vitale : chaque minute compte !"},
{i:"🪨",n:"Lithiase urinaire",d:"Formation de calculs dans les voies urinaires (rein, uretère, vessie). Obstruction possible → colique néphrétique. Douleur par distension des voies urinaires",f:"Déshydratation;Alimentation (sel, protéines, oxalates);Infections urinaires;Antécédents familiaux, terrain métabolique",s:"Colique néphrétique (douleur lombaire irradiant vers l'aine);Hématurie (sang dans les urines);Brûlures mictionnelles, pollakiurie;Nausées, vomissements",e:"BU (sang, leucocytes);Échographie / Scanner (examen de choix);Radiographie (parfois)",t:"Antalgiques, antispasmodiques;Hydratation;Lithotripsie (selon taille/localisation);Traitement de la cause;Éducation à l'hygiène de vie",r:SH,g:"Douleur intense non soulagée;Fièvre;Signes de choc",k:"Une douleur intense + fièvre ou ictère = consulter en urgence !"},
{i:"🟢",n:"Lithiase biliaire",d:"Formation de calculs dans la vésicule biliaire (ou voies biliaires). Peut rester asymptomatique ou entraîner une douleur par obstruction",f:"Femme, > 40 ans;Surpoids, régime riche en graisses;Grossesse, contraception œstroprogestative;ATCD familiaux, terrain métabolique",s:"Colique hépatique (douleur de l'hypochondre droit irradiant à l'épaule/dos);Nausées, vomissements;Fièvre (si cholécystite);Ictère (si obstruction du cholédoque)",e:"Échographie abdominale (examen de choix);Bilan hépatique (si ictère);Scanner / IRM (si doute)",t:"Antalgiques, anti-inflammatoires;Chirurgie (cholécystectomie);Antibiotiques (si infection)",r:SH,g:"Fièvre + douleur (cholécystite);Ictère;Douleur non soulagée;Signes de choc",k:"Une douleur intense + fièvre ou ictère = consulter en urgence !"},
{i:"⚡",n:"AIT (Accident Ischémique Transitoire)",d:"Interruption temporaire de la circulation sanguine cérébrale (ischémie) sans lésion irréversible. Durée < 24 h (le plus souvent < 1 h). Signe d'alerte d'un risque d'AVC",f:"HTA, diabète, dyslipidémie;Tabagisme, alcool;Âge > 65 ans;Cardiopathie (FA, valvulopathie);ATCD d'AIT ou d'AVC",s:"Troubles de la parole (dysarthrie, aphasie);Faiblesse ou paralysie d'un côté du corps;Troubles de la vision (vision floue, perte);Troubles de l'équilibre, vertiges;Fourmillements, engourdissements",e:"Scanner cérébral (en urgence);IRM (plus sensible);Écho-doppler des troncs supra-aortiques;ECG (recherche FA);Bilan sanguin (glycémie, cholestérol)",t:"Traitement antiagrégant (aspirine, clopidogrel);Contrôle des facteurs de risque;Traitement anticoagulant (si FA);Modification du mode de vie",r:"Évaluer les signes neurologiques (échelle FAST);Surveiller la TA, la glycémie, la FC;Alerter en cas de récidive ou de symptômes persistants;Préparer et accompagner aux examens;Éduquer sur les facteurs de risque et l'observance",g:"Symptômes > 1 heure ou qui persistent;Récidive des symptômes;Troubles neurologiques importants;Perte de connaissance",k:"Un AIT est un signal d'alarme : il faut agir pour éviter un AVC !"},
{i:"🌀",n:"Occlusion intestinale",d:"Arrêt du transit intestinal par une obstruction (mécanique ou fonctionnelle). Accumulation de gaz et de liquide en amont → distension, douleur, risque d'ischémie",f:"Mécanique : adhérences (chirurgie), tumeur, hernie, volvulus, invagination;Fonctionnelle : paralysie digestive (post-op, médicaments), troubles métaboliques (électrolytes)",s:"Douleur abdominale (par crises);Vomissements (souvent bilieux);Arrêt des matières et des gaz;Distension abdominale;Bruits hydro-aériques (ou absents)",e:"Radio abdominale (niveaux hydro-aériques);Scanner (examen de choix);Bilan sanguin (déshydratation, ionogramme);Toucher rectal (si besoin)",t:"Hydratation, rééquilibration;Sonde nasogastrique (décompression);Antalgie, antiémétiques;Chirurgie (si cause mécanique ou signes de gravité)",r:"Surveiller la douleur, les vomissements, les selles/gaz;Poser et surveiller la sonde nasogastrique;Évaluer l'hydratation (diurèse, TA, FC);Prévenir les complications (aspiration, déshydratation);Préparer et accompagner aux examens / intervention",g:"Douleur intense et persistante;Vomissements bilieux;Fièvre, tachycardie;Signes de choc;Signes de péritonite (défense, douleur ++);Arrêt total des matières et des gaz",k:"Plus l'occlusion est précoce, moins le risque de complications est important !"}];
const L={f:"Causes / facteurs de risque",s:"Signes cliniques",e:"Examens complémentaires",t:"Traitement",r:"Rôle IDE",g:"Signes de gravité / urgence"},K=Object.keys(L);
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.random()*a.length|0];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const ul=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
D.forEach(p=>K.forEach(k=>{p[k]=p[k]?p[k].split(";"):null}));
const V={};let deck,cur,Q,qi,sc;
function go(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));V[t]();window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
V.fiches=()=>{$("#v").innerHTML='<input id="q" placeholder="Rechercher (ex : nitrés, SpO2, ictère…)"><div id="l"></div>';
const dr=()=>{const q=norm($("#q").value);$("#l").innerHTML=D.filter(p=>!q||norm(JSON.stringify(p)).includes(q)).map(p=>`<details><summary>${p.i} ${p.n}</summary><p class="def">${p.d}</p>${K.map(k=>p[k]?`<h4>${L[k]}</h4>`+ul(p[k]):"").join("")}<p class="key">${p.k}</p></details>`).join("")};$("#q").oninput=dr;dr()};
V.flash=()=>{deck=sh(D.flatMap(p=>K.filter(k=>p[k]).map(k=>[p,k])));nf()};
function nf(){const v=$("#v");if(!deck.length){v.innerHTML='<div class="c"><b>Paquet terminé 🎉</b></div><button id="nw">Recommencer</button>';$("#nw").onclick=V.flash;return}
cur=deck.shift();v.innerHTML=`<div class="mu">${deck.length+1} carte(s) restante(s)</div><div class="c"><b>${L[cur[1]]}</b><br>${cur[0].i} ${cur[0].n}</div><button id="rv">Afficher la réponse</button><div id="an"></div>`;
$("#rv").onclick=()=>{$("#rv").hidden=1;$("#an").innerHTML=ul(cur[0][cur[1]])+'<div class="row"><button class="ko" id="no">À revoir</button><button class="ok" id="yes">Je savais</button></div>';$("#no").onclick=()=>{deck.splice(Math.min(4,deck.length),0,cur);nf()};$("#yes").onclick=nf}}
function mk(){const p=pick(D);
if(Math.random()<.3){return{q:"Quelle pathologie correspond à cette définition ?<br><i>"+p.d+"</i>",a:p.n,c:"<b>"+p.n+"</b> : "+p.d,o:sh([p.n,...sh(D.filter(x=>x!=p)).slice(0,3).map(x=>x.n)])}}
const k=pick(K.filter(k=>p[k])),ok=pick(p[k]),st=x=>norm(x).slice(0,8);
const pool=[...new Set(D.filter(x=>x!=p&&x[k]).flatMap(x=>x[k]))].filter(x=>!p[k].some(y=>st(y)==st(x)));
return{q:`Lequel fait partie de : <b>${L[k]}</b> — ${p.n} ?`,a:ok,c:"<b>"+p.n+" — "+L[k]+"</b>"+ul(p[k]),o:sh([ok,...sh(pool).slice(0,3)])}}
V.qcm=()=>{Q=Array.from({length:10},mk);qi=0;sc=0;sq()};
function sq(){const v=$("#v");if(qi>=Q.length){v.innerHTML=`<div class="c"><b>Score : ${sc}/${Q.length}</b></div><button id="nw">Nouveau QCM</button>`;$("#nw").onclick=V.qcm;return}
const q=Q[qi];v.innerHTML=`<div class="mu">Question ${qi+1}/${Q.length} · score ${sc}</div><div class="c">${q.q}</div>`+q.o.map(o=>`<button class="o">${o}</button>`).join("")+'<div id="nx"></div>';
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const r=b.textContent==q.a;if(r)sc++;document.querySelectorAll(".o").forEach(x=>{x.disabled=1;if(x.textContent==q.a)x.classList.add("ok")});if(!r)b.classList.add("ko");$("#nx").innerHTML=`<div class="c"><b class="${r?"hit":"miss"}">${r?"✓ Bonne réponse !":"✗ Mauvaise réponse"}</b><br>${q.c}</div><button id="n">Suivant</button>`;$("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});$("#n").onclick=()=>{qi++;sq()}})}
V.exam=()=>{const p=pick(D),k=pick(["d",...K.filter(k=>p[k])]),m=k=="d"?p.d.split(". "):p[k];
$("#v").innerHTML=`<div class="c">${k=="d"?`Définis et explique la physiopathologie : <b>${p.n}</b>`:`<b>${p.n}</b> — cite : ${L[k].toLowerCase()}`}</div><textarea id="ta" rows="8" placeholder="Écris ta réponse comme à l'examen…"></textarea><button id="ck">Corriger</button><div id="rs"></div>`;
$("#ck").onclick=()=>{const t=norm($("#ta").value);const h=m.map(x=>norm(x).split(/[^a-z0-9]+/).filter(w=>w.length>4).some(w=>t.includes(w.slice(0,6))));const n=h.filter(Boolean).length;
$("#rs").innerHTML=`<div class="c"><b>${n}/${m.length} éléments retrouvés</b><div class="mu">Correction automatique par mots-clés : indicative, juge toi-même.</div></div><div class="c">`+m.map((x,i)=>`<div class="${h[i]?"hit":"miss"}">${h[i]?"✓":"✗"} ${x}</div>`).join("")+`</div><button id="nw">Autre question</button>`;$("#nw").onclick=V.exam;$("#ck").style.display="none";$("#rs").scrollIntoView({behavior:"smooth"})}};
V.urg=()=>{$("#v").innerHTML='<div class="c"><b>🚨 Réflexe</b><br>AVC, angor persistant, OAP, BPCO avec SpO2 &lt; 90 % : appel immédiat au 15.</div>'+D.filter(p=>p.g).map(p=>`<div class="c"><b>${p.i} ${p.n}</b>${ul(p.g)}</div>`).join("")+'<div class="c"><b>⭐ À retenir</b>'+ul(D.map(p=>`<b>${p.n}</b> : ${p.k}`))+'</div>'};
const SEC=[["d","Définition"],["f","Facteurs de risque"],["s","Signes cliniques"],["e","Diagnostic (examens)"],["t","Traitements"],["r","Rôle IDE"],["g","Signes de gravité"]],LB=Object.fromEntries(SEC);let F={p:"all",k:SEC.map(x=>x[0]),n:"10"},EP;
function pane(title,cnt,fn){$("#v").innerHTML=`<h3 style="margin:8px 0">${title}</h3><div class="c"><b>Pathologie</b><select id="fp"><option value="all">Toutes les pathologies</option>${D.map((p,i)=>`<option value="${i}">${p.i} ${p.n}</option>`).join("")}</select></div><div class="c"><b>Parties à réviser</b>${SEC.map(([k,l])=>`<label class="ch"><input type="checkbox" value="${k}">${l}</label>`).join("")}<div class="row"><button id="a1">Tout cocher</button><button id="a0">Tout décocher</button></div></div>${cnt?`<div class="c"><b>Nombre de questions</b><select id="fn"><option>5</option><option>10</option><option>20</option><option value="999">Toutes</option></select></div>`:""}<button id="st">Commencer</button><div id="er" class="miss"></div>`;
const cb=()=>[...document.querySelectorAll(".ch input")];cb().forEach(x=>x.checked=F.k.includes(x.value));$("#fp").value=F.p;if(cnt)$("#fn").value=F.n;
$("#a1").onclick=()=>cb().forEach(x=>x.checked=1);$("#a0").onclick=()=>cb().forEach(x=>x.checked=0);
$("#st").onclick=()=>{F.p=$("#fp").value;F.k=cb().filter(x=>x.checked).map(x=>x.value);if(cnt)F.n=$("#fn").value;const ps=F.p=="all"?D:[D[F.p]];const pool=ps.flatMap(p=>F.k.filter(k=>k=="d"||p[k]).map(k=>[p,k]));if(!pool.length){$("#er").textContent="Aucune donnée pour cette sélection : coche d'autres parties.";return}fn(pool)}}
function mk2(p,k,ok){if(k=="d")return{q:"Quelle pathologie correspond à cette définition ?<br><i>"+p.d+"</i>",a:p.n,c:"<b>"+p.n+"</b> : "+p.d,o:sh([p.n,...sh(D.filter(x=>x!=p)).slice(0,3).map(x=>x.n)])};
const st=x=>norm(x).slice(0,8),pl=[...new Set(D.filter(x=>x!=p&&x[k]).flatMap(x=>x[k]))].filter(x=>!p[k].some(y=>st(y)==st(x)));
return{q:`Lequel fait partie de : <b>${LB[k]}</b> — ${p.n} ?`,a:ok,c:"<b>"+p.n+" — "+LB[k]+"</b>"+ul(p[k]),o:sh([ok,...sh(pl).slice(0,3)])}}
V.qcm=()=>pane("QCM",1,pool=>{const all=pool.flatMap(([p,k])=>k=="d"?[[p,k,p.d]]:p[k].map(x=>[p,k,x]));Q=sh(all).slice(0,+F.n).map(a=>mk2(...a));qi=0;sc=0;sq()});
V.exam=()=>pane("Examen",0,pool=>{EP=pool;ex()});
function ex(){const[p,k]=pick(EP),m=k=="d"?p.d.split(". "):p[k];
$("#v").innerHTML=`<div class="mu">${F.p=="all"?"Toutes les pathologies":D[F.p].n} · ${F.k.length} partie(s)</div><div class="c">${k=="d"?`Définis et explique la physiopathologie : <b>${p.n}</b>`:`<b>${p.n}</b> — cite : ${LB[k].toLowerCase()}`}</div><textarea id="ta" rows="8" placeholder="Écris ta réponse comme à l'examen…"></textarea><button id="ck">Valider</button><div id="rs"></div><button id="cs">Changer la sélection</button>`;
$("#cs").onclick=V.exam;$("#ck").onclick=()=>{const t=norm($("#ta").value),h=m.map(x=>norm(x).split(/[^a-z0-9]+/).filter(w=>w.length>4).some(w=>t.includes(w.slice(0,6)))),n=h.filter(Boolean).length;
$("#rs").innerHTML=`<div class="c"><b>${n}/${m.length} éléments retrouvés</b><div class="mu">Correction par mots-clés : indicative, juge toi-même.</div></div><div class="c">`+m.map((x,i)=>`<div class="${h[i]?"hit":"miss"}">${h[i]?"✓":"✗"} ${x}</div>`).join("")+`</div><button id="nw">Question suivante</button>`;$("#nw").onclick=ex;$("#ck").style.display="none";$("#rs").scrollIntoView({behavior:"smooth"})}}
go("fiches");
</script></body></html>
